  <script>
document.getElementById("surpriseForm").addEventListener("submit", function(e) {
    e.preventDefault();

    document.querySelector(".login-app__container").innerHTML = `
    <div style="
        max-width:900px;
        margin:50px auto;
        background:white;
        padding:50px;
        border-radius:12px;
        box-shadow:0 4px 20px rgba(0,0,0,.15);
        font-family:Arial,sans-serif;
        line-height:1.8;
    ">
        <h1 style="color:#ff520e;text-align:center;">
            Bedankt, mevrouw Vervisch! ❤️
        </h1>

        <p>
            Proficiat! U bent succesvol aangemeld op onze geheime Smartschool.
        </p>

        <p>
            Natuurlijk bestaat deze Smartschool niet echt. We wilden u gewoon verrassen
            met een berichtje van ons.
        </p>

        <p>
            U was soms een beetje humeurig (wat eerlijk gezegd best begrijpelijk is met
            een klas vol leerlingen 😄), maar u had altijd humor en wist precies hoe u
            een les leuk kon maken.
        </p>

        <p>
            We hebben veel van u geleerd. Niet alleen de leerstof, maar ook door de
            manier waarop u lesgaf en met ons omging.
        </p>

        <p>
            Bedankt voor alle uitleg, het geduld, de grapjes, de verbeteringen, de
            leuke momenten en alle energie die u in ons hebt gestoken.
        </p>

        <p>
            Uw lessen waren nooit zomaar lessen. Ze waren vaak grappig,
            interessant en iets waar we later nog aan zullen terugdenken.
        </p>

        <p>
            We zullen ons schooljaar met u nog lang herinneren.
        </p>

        <h2 style="text-align:center;color:#ff520e;margin-top:40px;">
            Bedankt voor alles!
        </h2>

        <p style="text-align:center;font-size:20px;">
            ❤️ Van uw leerlingen
        </p>
    </div>
    `;
});
</script>
