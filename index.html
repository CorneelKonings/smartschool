                  Verrassing, mevrouw Vervisch!

              <p>
                  Geen stress, u bent niet echt ingelogd op een vreemde Smartschool. Deze pagina hebben we zelf gemaakt voor u!
              </p>

              <p>
                  We wilden het schooljaar niet zomaar voorbij laten gaan zonder u te bedanken. Latijn is echt niet de makkelijkste taal, maar door uw lessen vond iedereen het tenminste leuk.
              </p>

              <p>
                  We vonden het heel fijn dat u altijd supermeegaand was. U nam echt de tijd voor ons och wilde altijd al onze vragen beantwoorden. U zorgde er telkens voor dat iedereen in de klas mee was ja de les snapte voor we verder gingen met de volgende dingen.
              </p>

              <p>
                  We weten dat we met 1LATA soms echt heel druk konden zijn en dat u daardoor ook wel eens een minder humeur had. Maar dat snappen we volledig met ons als klas! Het leuke was dat u daarna altijd direct weer grapjes maakte en de sfeer in de les weer helemaal goed maakte.
              </p>

              <p>
                  Bedankt voor al uw geduld met ons, de leuke moppen tussendoor, al het zware verbeterwerk en de energie die u elke dag in ons stak. We hebben dit jaar echt superveel geleerd.
              </p>

              <p>
                  U bent echt een topsubstituut en een geweldige leerkracht. We gaan uw lessen en de gezellige sfeer heel erg missen.
              </p>
